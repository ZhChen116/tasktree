<title>动态记事本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: nested circles (circle packing) of the whole tree; tap a circle to zoom into it,
   tap outside to zoom out. Below: the selected node's card, then decisions and recent activity. */
:root {
  --bg: #f2f4f7; --panel: #ffffff; --fg: #1a2029; --muted: #5c6773; --rule: #d9e0e7;
  --accent: #2f5f8f; --done: #2f7d5b; --doing: #c98a1b; --wait: #8a939d; --blocked: #b8483a; --decide: #7a4fb0;
  --chip-bg: #ecf0f4; --l0: #e6ebf1; --l1: #f6f8fa; --l2: #eef2f6; --l3: #f8fafb;
  --sans: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10141a; --panel: #19202a; --fg: #e4e9ef; --muted: #97a2ae; --rule: #29323d;
  --accent: #86b2dc; --done: #56b98a; --doing: #e3a843; --wait: #7f8a96; --blocked: #e0796b; --decide: #b693e6;
  --chip-bg: #222a34; --l0: #141a22; --l1: #1d252f; --l2: #232c37; --l3: #2a3440; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10141a; --panel: #19202a; --fg: #e4e9ef; --muted: #97a2ae; --rule: #29323d;
  --accent: #86b2dc; --done: #56b98a; --doing: #e3a843; --wait: #7f8a96; --blocked: #e0796b; --decide: #b693e6;
  --chip-bg: #222a34; --l0: #141a22; --l1: #1d252f; --l2: #232c37; --l3: #2a3440; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; display: grid; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 10px; }
h2 { font-size: 1rem; margin: 0 0 8px; }
.stamp { color: var(--muted); font-size: .8rem; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .88rem; min-height: 30px; }
.crumbs button { font: inherit; border: 1px solid var(--rule); background: var(--panel); color: var(--accent); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.crumbs b { font-weight: 500; padding: 2px 4px; }
.sep { color: var(--muted); }
.stage { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
svg#pack { display: block; width: 100%; height: auto; cursor: zoom-out; }
svg#pack circle { cursor: pointer; }
svg#pack text { font-family: var(--sans); pointer-events: none; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; fill: var(--fg); }
svg#pack text.sub { font-family: var(--mono); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .74rem; color: var(--muted); padding: 6px 12px 8px; border-top: 1px solid var(--rule); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.ring { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; border: 2px solid var(--doing); box-sizing: border-box; }
.s-done { background: var(--done); } .s-doing { background: var(--doing); } .s-waiting { background: var(--wait); }
.s-blocked { background: var(--blocked); } .s-decide { background: var(--decide); }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.card .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .ttl { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.card a { color: var(--accent); font-size: .86rem; }
.chip { font-size: .74rem; padding: 1px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); white-space: nowrap; }
.chip.st { color: var(--fg); }
.next { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.next b { color: var(--fg); font-weight: 500; }
.blk { font-size: .82rem; color: var(--blocked); }
.kids { display: grid; gap: 4px; }
.kid { font: inherit; font-size: .86rem; display: flex; align-items: center; gap: 6px; text-align: left; border: 0; border-top: 1px solid var(--rule); background: none; color: var(--fg); padding: 6px 2px; cursor: pointer; min-width: 0; }
.kid span.t { flex: 1; overflow-wrap: anywhere; }
.kid span.c { font-family: var(--mono); font-size: .74rem; color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.dcard { border-left: 3px solid var(--decide); padding: 4px 0 4px 10px; display: grid; gap: 5px; margin-bottom: 10px; }
.dcard .q { font-weight: 500; cursor: pointer; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
button.opt { font: inherit; font-size: .84rem; border: 1px solid var(--rule); background: var(--chip-bg); color: var(--fg); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
button.opt.chosen { border-color: var(--decide); color: var(--decide); font-weight: 500; }
.answered { font-size: .8rem; color: var(--decide); }
.empty { color: var(--muted); font-size: .88rem; }
ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ol.log li { display: grid; grid-template-columns: 6.8em 1fr; gap: 8px; font-size: .85rem; min-width: 0; }
ol.log time { font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
ol.log span { overflow-wrap: anywhere; }
#refreshBtn { border: 1px solid var(--rule); background: var(--panel); color: var(--accent); border-radius: 999px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
#refreshMsg { font-size: .78rem; font-weight: 400; color: var(--muted); }
label.tog { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
</style>

<div class="wrap">
  <header>
    <h1 id="treeTitle">动态记事本<button id="refreshBtn" type="button" title="让 Claude 同步" aria-label="让 Claude 同步"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button><span id="refreshMsg"></span></h1>
    <div class="stamp" id="stamp">正在读取…</div>
  </header>

  <div class="crumbs" id="crumbs" aria-label="位置"></div>

  <div class="stage">
    <svg id="pack" role="img" aria-label="所有事情的嵌套圆：大圆是工作线，里面的小圆是项目和任务。点一个圆放大进去，点空白处退出一层。"></svg>
    <div class="legend" aria-hidden="true">
      <span><i class="dot s-decide"></i>等你决定</span><span><i class="dot s-blocked"></i>卡住</span>
      <span><i class="dot s-doing"></i>在做</span><span><i class="dot s-waiting"></i>等待</span><span><i class="dot s-done"></i>完成</span>
      <span><i class="ring"></i>圈的边框 = 里面最急的状态</span><span>点圆放大 · 点空白退出</span>
    </div>
  </div>

  <div class="card" id="card" aria-live="polite"><div class="empty">Claude 同步数据后，这里显示你点中的那件事。</div></div>
  <label class="tog"><input type="checkbox" id="hideDone"> 隐藏已完成的</label>

  <div class="cols">
    <section class="panel" aria-labelledby="h-dec"><h2 id="h-dec">等你决定</h2><div id="decisions" class="empty">读取中。</div></section>
    <section class="panel" aria-labelledby="h-log"><h2 id="h-log">最近动态</h2><ol class="log" id="log"><li class="empty">读取中。</li></ol></section>
  </div>
</div>

<script>
const ST = { done: "完成", doing: "在做", waiting: "等待", blocked: "卡住", decide: "等你决定" };
const RANK = { decide: 5, blocked: 4, doing: 3, waiting: 2, done: 1 };
const TYPE = { workstream: "工作线", project: "项目", decision: "决定", deliverable: "交付物", job: "作业" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let nodes = {}, meta = null, db = null, hideDone = false;
let root = null, focus = null, selected = null, view = null;
try { hideDone = localStorage.getItem("ttHideDone") === "1"; } catch (e) {}
document.getElementById("hideDone").checked = hideDone;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// ----- tree rules (same as tasktree/model.py) -----
function kidsOf(id) { return Object.values(nodes).filter(n => (n.parent || null) === id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function rollup(n, seen = new Set()) {
  if (seen.has(n.id)) return n.status || "waiting"; seen.add(n.id);
  const ks = kidsOf(n.id);
  if (!ks.length) return n.status || "waiting";
  const sts = ks.map(k => rollup(k, seen));
  if (sts.every(s => s === "done")) return ["doing", "blocked", "decide"].includes(n.status) ? n.status : "done";
  let best = "waiting"; for (const s of sts) if (s !== "done" && RANK[s] > RANK[best]) best = s;
  if (n.status && n.status !== "done" && RANK[n.status] > RANK[best]) best = n.status;
  return best;
}
function leaves(n) { const ks = kidsOf(n.id); if (!ks.length) return [n.status === "done" ? 1 : 0, 1]; return ks.reduce((a, k) => { const [d, t] = leaves(k); return [a[0] + d, a[1] + t]; }, [0, 0]); }
function short(t, max) { return t.length > max ? t.slice(0, Math.max(1, max - 1)) + "…" : t; }

// ----- circle packing -----
const svg = d3.select("#pack");
let W = 600;
function build() {
  const visible = id => !hideDone || rollup(nodes[id]) !== "done";
  const mk = id => {
    const ks = kidsOf(id === "__root" ? null : id).filter(k => visible(k.id));
    const n = id === "__root" ? { id: "__root", title: "全部" } : nodes[id];
    return { id, node: n, children: ks.length ? ks.map(k => mk(k.id)) : undefined };
  };
  const h = d3.hierarchy(mk("__root"))
    .sum(d => d.children ? 0 : (d.node.status === "done" ? 0.45 : d.node.type === "decision" ? 1.3 : 1))
    .sort((a, b) => (RANK[st(b)] - RANK[st(a)]) || (b.value - a.value));
  W = Math.min(document.querySelector(".stage").clientWidth || 600, 820);
  root = d3.pack().size([W, W]).padding(d => d.depth === 0 ? 8 : 4)(h);
}
function st(d) { return d.data.id === "__root" ? "doing" : rollup(d.data.node); }

function draw() {
  const C = { done: css("--done"), doing: css("--doing"), waiting: css("--wait"), blocked: css("--blocked"), decide: css("--decide") };
  const fills = [css("--l0"), css("--l1"), css("--l2"), css("--l3")];
  svg.attr("viewBox", `${-W / 2} ${-W / 2} ${W} ${W}`).selectAll("*").remove();
  svg.on("click", () => { if (focus && focus.parent) zoom(focus.parent); });
  const all = root.descendants();
  svg.append("g").selectAll("circle").data(all, d => d.data.id).join("circle")
    .attr("fill", d => d.children ? fills[Math.min(d.depth, 3)] : C[st(d)])
    .attr("fill-opacity", d => !d.children && st(d) === "done" ? 0.45 : 1)
    .attr("stroke", d => d.depth === 0 ? "none" : d.children ? C[st(d)] : (selected === d ? css("--fg") : "none"))
    .attr("stroke-width", d => d.children ? (d.depth === 1 ? 2.5 : 1.8) : 2.5)
    .attr("stroke-opacity", d => d.children && st(d) === "done" ? 0.4 : 0.9)
    .attr("pointer-events", d => d.depth === 0 ? "none" : null)
    .on("click", (ev, d) => { ev.stopPropagation(); if (d.children && d !== focus) zoom(d); else select(d); });
  const label = svg.append("g").selectAll("g").data(all.filter(d => d.depth > 0), d => d.data.id).join("g").attr("class", "lbl");
  label.append("text").attr("class", "main").attr("text-anchor", "middle");
  label.append("text").attr("class", "sub").attr("text-anchor", "middle");
  apply(view || [root.x, root.y, root.r * 2]);
}
function visibleLabel(d) { return d.parent === focus || (d === focus && !d.children); }
function apply(v) {
  view = v; const k = W / v[2];
  svg.selectAll("circle").attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`).attr("r", d => d.r * k);
  svg.selectAll("g.lbl").each(function (d) {
    const r = d.r * k, show = visibleLabel(d) && r > 16, g = d3.select(this);
    const x = (d.x - v[0]) * k, y = (d.y - v[1]) * k;
    const fs = Math.max(11, Math.min(17, r / 3.2)), maxChars = Math.max(2, Math.floor((r * 1.8) / fs));
    const yOff = d.children ? -r + fs + 6 : 0;   // parents: label near the top edge so children stay visible
    g.select("text.main").attr("x", x).attr("y", y + yOff).attr("dy", d.children ? 0 : "0.35em")
      .attr("font-size", fs).attr("font-weight", d.children ? 700 : 500)
      .style("display", show ? null : "none").text(short(d.data.node.title, maxChars));
    const [dn, t] = leaves(d.data.node);
    g.select("text.sub").attr("x", x).attr("y", y + yOff + fs * 1.05).attr("font-size", Math.max(10, fs * 0.72))
      .style("display", show && d.children && r > 40 ? null : "none").text(dn + "/" + t);
  });
}
function zoom(d) {
  focus = d; selected = d;
  const target = [d.x, d.y, d.r * 2.08];
  const i = d3.interpolateZoom(view, target);
  svg.transition().duration(reduceMotion ? 0 : 650).tween("zoom", () => t => apply(i(t)))
    .on("end", () => apply(target));
  svg.selectAll("circle").attr("stroke", c => c.depth === 0 ? "none" : c.children ? css(sVar(st(c))) : "none");
  renderCrumbs(); renderCard();
}
function select(d) {
  selected = d;
  svg.selectAll("circle").filter(c => !c.children).attr("stroke", c => c === d ? css("--fg") : "none");
  renderCard();
}
function sVar(s) { return { done: "--done", doing: "--doing", waiting: "--wait", blocked: "--blocked", decide: "--decide" }[s]; }
function findById(id) { return root && root.descendants().find(d => d.data.id === id); }

// ----- DOM parts -----
function renderCrumbs() {
  const c = document.getElementById("crumbs"); c.textContent = "";
  if (!focus) return;
  const path = focus.ancestors().reverse();
  path.forEach((d, i) => {
    if (i) c.appendChild(el("span", "sep", "›"));
    const name = d.data.id === "__root" ? "全部" : d.data.node.title;
    if (i === path.length - 1) c.appendChild(el("b", null, name));
    else { const b = el("button", null, name); b.type = "button"; b.addEventListener("click", () => zoom(d)); c.appendChild(b); }
  });
}
function renderCard() {
  const card = document.getElementById("card"); card.textContent = "";
  const d = selected || focus;
  if (!d || d.data.id === "__root") {
    const open = Object.values(nodes).filter(n => !kidsOf(n.id).length && n.status !== "done").length;
    card.appendChild(el("div", "ttl", "全部"));
    card.appendChild(el("div", "next", Object.keys(nodes).length ? `一共 ${Object.keys(nodes).length} 项，${open} 件没做完。点一个大圆进入那条工作线。` : "还没有数据。在任何一个 Claude session 里说“同步记事本”。"));
    if (root && root.children) card.appendChild(kidList(root));
    return;
  }
  const n = d.data.node, s = st(d);
  const row = el("div", "row"); row.appendChild(el("i", "dot s-" + s)); row.appendChild(el("span", "ttl", n.title)); card.appendChild(row);
  const m = el("div", "row");
  m.appendChild(el("span", "chip st", ST[s]));
  if (TYPE[n.type]) m.appendChild(el("span", "chip", TYPE[n.type]));
  if (n.owner) m.appendChild(el("span", "chip", n.owner));
  if (n.date) m.appendChild(el("span", "chip", n.date + (n.updated && n.updated !== n.date ? " → " + n.updated : "")));
  if (kidsOf(n.id).length) { const [a, t] = leaves(n); m.appendChild(el("span", "chip", "完成 " + a + "/" + t)); }
  card.appendChild(m);
  if (n.next && s !== "done") { const p = el("div", "next"); p.appendChild(el("b", null, "下一步 ")); p.appendChild(document.createTextNode(n.next)); card.appendChild(p); }
  const bl = (n.blocked_by || []).filter(id => nodes[id] && rollup(nodes[id]) !== "done");
  if (bl.length) card.appendChild(el("div", "blk", "等 " + bl.map(id => nodes[id].title).join("、")));
  if (Array.isArray(n.links) && n.links.length) {
    const L = el("div", "row");
    n.links.forEach(l => { if (l && l.url && /^https:\/\//.test(l.url)) { const a = el("a", null, l.label || "链接"); a.href = l.url; a.target = "_blank"; a.rel = "noopener"; L.appendChild(a); } });
    card.appendChild(L);
  }
  if (n.type === "decision" && n.status === "decide") card.appendChild(optionRow(n));
  if (d.children) card.appendChild(kidList(d));
}
function kidList(d) {
  const box = el("div", "kids");
  d.children.forEach(c => {
    const b = el("button", "kid"); b.type = "button";
    b.appendChild(el("i", "dot s-" + st(c))); b.appendChild(el("span", "t", c.data.node.title));
    if (c.children) { const [a, t] = leaves(c.data.node); b.appendChild(el("span", "c", a + "/" + t + " ›")); }
    else if (c.data.node.next && st(c) !== "done") b.appendChild(el("span", "c", short(c.data.node.next, 14)));
    b.addEventListener("click", () => c.children ? zoom(c) : (focus === d ? select(c) : (zoom(d), select(c))));
    box.appendChild(b);
  });
  return box;
}
function optionRow(n) {
  const box = el("div"); const opts = el("div", "opts");
  (n.options || []).forEach(o => { const b = el("button", "opt" + (n.answer === o ? " chosen" : ""), o); b.type = "button"; b.addEventListener("click", () => choose(n, o, b)); opts.appendChild(b); });
  box.appendChild(opts);
  if (n.answer) box.appendChild(el("div", "answered", "已选：" + n.answer + "（Claude 下次同步时写回）"));
  return box;
}
async function choose(n, o, btn) {
  if (!db) return;
  btn.disabled = true;
  try {
    await db.collection("nodes").doc(n.id).update({ answer: o, answered_at: new Date().toISOString() });
    try { const c = await claude.use("comments"); if (c && (await c.canSendToClaude()) === "available") await c.sendToClaude({ anchor: await c.anchorFor(document.getElementById("h-dec")), text: "决定 " + n.id + "：" + o }); } catch (e) {}
  } catch (e) { btn.disabled = false; btn.parentNode.after(el("div", "answered", "没记上（" + ((e && e.code) || "错误") + "），可以在评论里写给 Claude。")); }
}
function renderDecisions() {
  const box = document.getElementById("decisions"); box.textContent = ""; box.className = "";
  const ds = Object.values(nodes).filter(n => n.type === "decision" && n.status === "decide");
  if (!ds.length) { box.className = "empty"; box.textContent = "现在没有等你决定的事。"; return; }
  ds.forEach(n => {
    const c = el("div", "dcard"); const q = el("div", "q", n.title); q.title = "在圆里找到它";
    q.addEventListener("click", () => { const d = findById(n.id); if (d) { zoom(d.parent); select(d); document.querySelector(".stage").scrollIntoView({ block: "nearest" }); } });
    c.appendChild(q);
    const path = []; let p = n.parent && nodes[n.parent]; while (p) { path.unshift(p.title); p = p.parent && nodes[p.parent]; }
    if (path.length) c.appendChild(el("div", "next", path.join(" › ")));
    c.appendChild(optionRow(n)); box.appendChild(c);
  });
}
function renderLog() {
  const ol = document.getElementById("log"); ol.textContent = "";
  const rows = (meta && Array.isArray(meta.recent)) ? meta.recent : [];
  if (!rows.length) { ol.appendChild(el("li", "empty", "还没有动态。")); return; }
  rows.slice(0, 20).forEach(r => { const li = el("li"); li.appendChild(el("time", null, r.ts || "")); li.appendChild(el("span", null, r.text || "")); ol.appendChild(li); });
}
function renderAll() {
  const keepFocus = focus && focus.data.id, keepSel = selected && selected.data.id;
  build();
  focus = (keepFocus && findById(keepFocus)) || root;
  selected = (keepSel && findById(keepSel)) || focus;
  view = [focus.x, focus.y, focus.r * 2.08];
  draw(); renderCrumbs(); renderCard(); renderDecisions(); renderLog();
  document.getElementById("stamp").textContent = meta && meta.snapshot ? "最近同步 " + meta.snapshot : "还没有同步过";
}
document.getElementById("hideDone").addEventListener("change", e => { hideDone = e.target.checked; try { localStorage.setItem("ttHideDone", hideDone ? "1" : "0"); } catch (x) {} renderAll(); });
let rt = null; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderAll, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => renderAll());
renderAll();
try { const h = decodeURIComponent((location.hash || "").slice(1)); if (h) { const d = findById(h); if (d) zoom(d.children ? d : d.parent); } } catch (e) {}

(async () => {
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { document.getElementById("stamp").textContent = "这个视图读不到数据（需要登录并打开原链接）。"; return; }
  db.collection("nodes").onSnapshot(snap => {
    const next = {}; let m = null;
    snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === "_meta") m = v; else next[d.id] = Object.assign({ id: d.id }, v); });
    nodes = next; meta = m; renderAll();
  }, err => { document.getElementById("stamp").textContent = "读取失败（" + ((err && err.code) || "错误") + "）。"; });
})();

(async () => {
  const btn = document.getElementById("refreshBtn"), msg = document.getElementById("refreshMsg");
  let c = null;
  try { c = await claude.use("comments"); } catch (e) { c = null; }
  btn.addEventListener("click", async () => {
    if (!c) { msg.textContent = "请在评论里写“同步记事本”"; return; }
    btn.disabled = true; msg.textContent = "正在发给 Claude…";
    let ok = false, code = "";
    try { if ((await c.canSendToClaude()) === "available") { await c.sendToClaude({ anchor: await c.anchorFor(document.getElementById("treeTitle")), text: "同步记事本" }); ok = true; } else code = "no_session"; }
    catch (e) { code = (e && e.code) || "error"; }
    btn.disabled = false;
    if (ok) { msg.textContent = "已发给 Claude"; return; }
    try { const r = await c.openComposer({ element: document.getElementById("treeTitle") }); msg.textContent = r && r.opened ? "写“同步记事本”，点 Send to Claude" : "发送没成功（" + code + "）"; }
    catch (e2) { msg.textContent = "发送没成功（" + code + "）"; }
  });
})();
</script>
