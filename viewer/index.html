<title>动态记事本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a rotatable globe of the current level's nodes (drag to spin, tap to go in),
   a card for the node facing you, then pending decisions and recent activity. */
:root {
  --bg: #f2f4f7; --panel: #ffffff; --fg: #1a2029; --muted: #5c6773; --rule: #d9e0e7;
  --accent: #2f5f8f; --done: #2f7d5b; --doing: #c98a1b; --wait: #7b8590; --blocked: #b8483a; --decide: #7a4fb0;
  --chip-bg: #ecf0f4; --core: #dfe6ee; --ring: #c5d0db;
  --sans: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10141a; --panel: #19202a; --fg: #e4e9ef; --muted: #97a2ae; --rule: #29323d;
  --accent: #86b2dc; --done: #56b98a; --doing: #e3a843; --wait: #8a95a1; --blocked: #e0796b; --decide: #b693e6;
  --chip-bg: #222a34; --core: #1d2631; --ring: #2c3744; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10141a; --panel: #19202a; --fg: #e4e9ef; --muted: #97a2ae; --rule: #29323d;
  --accent: #86b2dc; --done: #56b98a; --doing: #e3a843; --wait: #8a95a1; --blocked: #e0796b; --decide: #b693e6;
  --chip-bg: #222a34; --core: #1d2631; --ring: #2c3744; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; display: grid; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 1.3rem; margin: 0; display: flex; align-items: center; gap: 10px; }
h2 { font-size: 1rem; margin: 0 0 8px; }
.stamp { color: var(--muted); font-size: .8rem; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .88rem; min-height: 30px; }
.crumbs button { font: inherit; border: 1px solid var(--rule); background: var(--panel); color: var(--accent); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.crumbs b { font-weight: 500; padding: 2px 4px; }
.sep { color: var(--muted); }
.stage { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 8px; font-size: .74rem; color: var(--muted); pointer-events: none; }
.legend { position: absolute; right: 12px; top: 10px; display: grid; gap: 2px; font-size: .72rem; color: var(--muted); pointer-events: none; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.s-done { background: var(--done); } .s-doing { background: var(--doing); } .s-waiting { background: var(--wait); }
.s-blocked { background: var(--blocked); } .s-decide { background: var(--decide); }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.card .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card .ttl { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.chip { font-size: .74rem; padding: 1px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); white-space: nowrap; }
.chip.st { color: var(--fg); }
.next { font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
.next b { color: var(--fg); font-weight: 500; }
.blk { font-size: .82rem; color: var(--blocked); }
.kids { display: flex; flex-wrap: wrap; gap: 6px; }
.kid { font: inherit; font-size: .8rem; display: inline-flex; align-items: center; border: 1px solid var(--rule); background: var(--chip-bg); color: var(--fg); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button.btn { font: inherit; font-size: .85rem; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 8px; padding: 4px 14px; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.dcard { border-left: 3px solid var(--decide); padding: 4px 0 4px 10px; display: grid; gap: 5px; margin-bottom: 10px; }
.dcard .q { font-weight: 500; cursor: pointer; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
button.opt { font: inherit; font-size: .84rem; border: 1px solid var(--rule); background: var(--chip-bg); color: var(--fg); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
button.opt.chosen { border-color: var(--decide); color: var(--decide); font-weight: 500; }
.answered { font-size: .8rem; color: var(--decide); }
.empty { color: var(--muted); font-size: .88rem; }
ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ol.log li { display: grid; grid-template-columns: 6.8em 1fr; gap: 8px; font-size: .85rem; min-width: 0; }
ol.log time { font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
ol.log span { overflow-wrap: anywhere; }
#refreshBtn { border: 1px solid var(--rule); background: var(--panel); color: var(--accent); border-radius: 999px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
#refreshMsg { font-size: .78rem; font-weight: 400; color: var(--muted); }
label.tog { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
</style>

<div class="wrap">
  <header>
    <h1 id="treeTitle">动态记事本<button id="refreshBtn" type="button" title="让 Claude 同步" aria-label="让 Claude 同步"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button><span id="refreshMsg"></span></h1>
    <div class="stamp" id="stamp">正在读取…</div>
  </header>

  <div class="crumbs" id="crumbs" aria-label="位置"></div>

  <div class="stage" id="stage">
    <canvas id="globe" aria-label="当前这一层的事情分布在球面上：拖动旋转，点一下进入"></canvas>
    <div class="legend" aria-hidden="true">
      <span><i class="dot s-decide"></i>等你决定</span><span><i class="dot s-blocked"></i>卡住</span>
      <span><i class="dot s-doing"></i>在做</span><span><i class="dot s-waiting"></i>等待</span><span><i class="dot s-done"></i>完成</span>
    </div>
    <div class="hint" id="hint">拖动旋转 · 点一下进入 · 点中心返回上一层</div>
  </div>

  <div class="card" id="card" aria-live="polite"><div class="empty">Claude 同步数据后，转到正面的那件事会显示在这里。</div></div>
  <label class="tog"><input type="checkbox" id="showDone"> 球上也显示已完成的</label>

  <div class="cols">
    <section class="panel" aria-labelledby="h-dec"><h2 id="h-dec">等你决定</h2><div id="decisions" class="empty">读取中。</div></section>
    <section class="panel" aria-labelledby="h-log"><h2 id="h-log">最近动态</h2><ol class="log" id="log"><li class="empty">读取中。</li></ol></section>
  </div>
</div>

<script>
const ST = { done: "完成", doing: "在做", waiting: "等待", blocked: "卡住", decide: "等你决定" };
const RANK = { decide: 5, blocked: 4, doing: 3, waiting: 2, done: 1 };
const TYPE = { workstream: "工作线", project: "项目", decision: "决定", deliverable: "交付物", job: "作业", task: "任务" };
let nodes = {}, meta = null, db = null, focusId = null, showDone = false;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
try { showDone = localStorage.getItem("ttShowDone") === "1"; } catch (e) {}
document.getElementById("showDone").checked = showDone;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// ----- tree rules (same as tasktree/model.py) -----
function kids(id) { return Object.values(nodes).filter(n => (n.parent || null) === id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function rollup(n, seen = new Set()) {
  if (seen.has(n.id)) return n.status || "waiting"; seen.add(n.id);
  const ks = kids(n.id);
  if (!ks.length) return n.status || "waiting";
  const sts = ks.map(k => rollup(k, seen));
  if (sts.every(s => s === "done")) return ["doing", "blocked", "decide"].includes(n.status) ? n.status : "done";
  let best = "waiting"; for (const s of sts) if (s !== "done" && RANK[s] > RANK[best]) best = s;
  if (n.status && n.status !== "done" && RANK[n.status] > RANK[best]) best = n.status;
  return best;
}
function leaves(n) { const ks = kids(n.id); if (!ks.length) return [n.status === "done" ? 1 : 0, 1]; return ks.reduce((a, k) => { const [d, t] = leaves(k); return [a[0] + d, a[1] + t]; }, [0, 0]); }
function urgentCount(n) { const ks = kids(n.id); if (!ks.length) return (n.status === "decide" || n.status === "blocked") ? 1 : 0; return ks.reduce((s, k) => s + urgentCount(k), 0); }
function pathTo(id) { const p = []; let c = id && nodes[id]; while (c) { p.unshift(c); c = c.parent && nodes[c.parent]; } return p; }

// ----- globe state -----
const cv = document.getElementById("globe"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
let W = 0, H = 0, DPR = 1, R = 0;
let rot = [1, 0, 0, 0, 1, 0, 0, 0, 1];             // rotation matrix, row-major
let pts = [];                                       // {node, base:[x,y,z]}
let vx = 0, vy = 0, lastInteract = 0, enterT = 1, frontId = null;
let drag = null;

function mul(a, b) { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]; return r; }
function rotY(t) { const c = Math.cos(t), s = Math.sin(t); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
function rotX(t) { const c = Math.cos(t), s = Math.sin(t); return [1, 0, 0, 0, c, -s, 0, s, c]; }
function apply(m, v) { return [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]]; }

function layout() {
  let ks = kids(focusId);
  if (!showDone) { const open = ks.filter(k => rollup(k) !== "done"); if (open.length) ks = open; }
  const n = ks.length, g = Math.PI * (3 - Math.sqrt(5));
  pts = ks.map((node, i) => {
    if (n === 1) return { node, base: [0, 0, 1] };
    const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), th = i * g;
    return { node, base: [r * Math.sin(th), y * 0.92, r * Math.cos(th)] };
  });
  rot = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  enterT = reduceMotion ? 1 : 0;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth; H = Math.round(Math.min(Math.max(W * 0.86, 300), 560));
  cv.width = W * DPR; cv.height = H * DPR; cv.style.height = H + "px";
  R = Math.min(W, H) * 0.36;
}
function project(v) { const d = 3.2, s = d / (d - v[2]); return { x: W / 2 + v[0] * R * s, y: H / 2 - v[1] * R * s, s, z: v[2] }; }
function bubbleR(node, s) { const [, t] = leaves(node); return Math.max(14, Math.min(40, 12 + 7 * Math.sqrt(t))) * s * (W < 480 ? 0.85 : 1); }
function shorten(t, max) { return t.length > max ? t.slice(0, max - 1) + "…" : t; }

function draw() {
  const C = { done: css("--done"), doing: css("--doing"), waiting: css("--wait"), blocked: css("--blocked"), decide: css("--decide") };
  const fg = css("--fg"), muted = css("--muted"), panel = css("--panel"), core = css("--core"), ring = css("--ring");
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const k = 0.55 + 0.45 * easeOut(enterT);
  // the globe itself
  ctx.beginPath(); ctx.arc(W / 2, H / 2, R * 1.04 * k, 0, Math.PI * 2);
  ctx.strokeStyle = ring; ctx.lineWidth = 1; ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);
  // center core = where you are
  const here = focusId ? nodes[focusId] : null;
  const coreR = Math.max(26, R * 0.22) * k;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, coreR, 0, Math.PI * 2); ctx.fillStyle = core; ctx.fill();
  ctx.fillStyle = muted; ctx.font = `500 ${Math.round(12 * (W < 480 ? 0.95 : 1))}px ${css("--sans")}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(shorten(here ? here.title : "全部", 7), W / 2, H / 2 - (focusId ? 7 : 0));
  if (focusId) { ctx.font = `400 11px ${css("--sans")}`; ctx.fillText("↩ 返回", W / 2, H / 2 + 10); }

  const proj = pts.map(p => { const v = apply(rot, p.base); const q = project([v[0] * k, v[1] * k, v[2] * k]); return { p, q, v }; });
  proj.sort((a, b) => a.q.z - b.q.z);
  let best = null;
  for (const { p, q, v } of proj) {
    const st = rollup(p.node), r = bubbleR(p.node, q.s);
    const depth = (v[2] + 1) / 2, alpha = (0.28 + 0.72 * depth) * easeOut(enterT);
    // spoke to the core
    ctx.globalAlpha = alpha * 0.35; ctx.strokeStyle = ring; ctx.beginPath(); ctx.moveTo(W / 2, H / 2); ctx.lineTo(q.x, q.y); ctx.stroke();
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
    ctx.fillStyle = C[st]; ctx.fill();
    ctx.lineWidth = p.node.id === frontId ? 3 : 1.5; ctx.strokeStyle = p.node.id === frontId ? fg : panel; ctx.stroke();
    // leaf count inside, small ring for children
    const [d, t] = leaves(p.node);
    if (kids(p.node.id).length) {
      ctx.fillStyle = panel; ctx.font = `600 ${Math.max(10, Math.round(r * 0.5))}px ${css("--mono")}`; ctx.fillText(d + "/" + t, q.x, q.y);
    }
    const u = urgentCount(p.node);
    if (u && st !== "done") { ctx.beginPath(); ctx.arc(q.x + r * 0.75, q.y - r * 0.75, 8, 0, Math.PI * 2); ctx.fillStyle = C.decide; ctx.fill(); ctx.fillStyle = panel; ctx.font = `700 10px ${css("--mono")}`; ctx.fillText(String(u), q.x + r * 0.75, q.y - r * 0.75 + 0.5); }
    // label
    if (v[2] > -0.35) {
      ctx.fillStyle = fg; ctx.font = `${v[2] > 0.6 ? 700 : 500} ${Math.round(12.5 * Math.min(1.15, q.s))}px ${css("--sans")}`;
      ctx.fillText(shorten(p.node.title, W < 480 ? 9 : 14), q.x, q.y + r + 12);
    }
    ctx.globalAlpha = 1;
    p.screen = { x: q.x, y: q.y, r, z: v[2] };
    if (!best || v[2] > best.z) best = { id: p.node.id, z: v[2] };
  }
  const newFront = best ? best.id : null;
  if (newFront !== frontId) { frontId = newFront; renderCard(); }
}
function easeOut(t) { return 1 - Math.pow(1 - Math.min(1, t), 3); }

function tick(now) {
  if (!drag) {
    if (Math.abs(vx) > 1e-5 || Math.abs(vy) > 1e-5) { rot = mul(rotX(vy), mul(rotY(vx), rot)); vx *= 0.94; vy *= 0.94; }
    else if (!reduceMotion && now - lastInteract > 4000 && pts.length > 1) rot = mul(rotY(0.0025), rot);
  }
  if (enterT < 1) enterT += 0.06;
  draw();
  requestAnimationFrame(tick);
}

// ----- input: drag to spin, tap to enter -----
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0 }; vx = vy = 0; lastInteract = performance.now(); cv.classList.add("dragging"); });
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  const ax = dx / (R * 1.2), ay = dy / (R * 1.2);
  rot = mul(rotX(ay), mul(rotY(ax), rot)); vx = ax; vy = ay; lastInteract = performance.now();
});
function endDrag(e) {
  if (!drag) return;
  const tap = drag.moved < 8; cv.classList.remove("dragging"); drag = null; lastInteract = performance.now();
  if (!tap) return;
  vx = vy = 0;
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  const hit = pts.filter(p => p.screen && Math.hypot(p.screen.x - x, p.screen.y - y) <= p.screen.r + 6).sort((a, c) => c.screen.z - a.screen.z)[0];
  if (hit) { open(hit.node.id); return; }
  if (focusId && Math.hypot(x - W / 2, y - H / 2) < Math.max(26, R * 0.22)) go(nodes[focusId].parent || null);
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", () => { drag = null; cv.classList.remove("dragging"); });

function open(id) { if (kids(id).length) go(id); else { frontId = id; renderCard(true); bringToFront(id); } }
function go(id) { focusId = id || null; frontId = null; layout(); renderCrumbs(); renderCard(); }
function bringToFront(id) {
  const p = pts.find(p => p.node.id === id); if (!p) return;
  const v = apply(rot, p.base), yaw = Math.atan2(v[0], v[2]); let m = mul(rotY(-yaw), rot);
  const v2 = apply(m, p.base), pitch = Math.atan2(v2[1], v2[2]); rot = mul(rotX(pitch), m); vx = vy = 0; lastInteract = performance.now();
}

// ----- DOM parts -----
function renderCrumbs() {
  const c = document.getElementById("crumbs"); c.textContent = "";
  const top = el("button", null, "全部"); top.type = "button"; top.addEventListener("click", () => go(null));
  if (!focusId) { c.appendChild(el("b", null, "全部")); return; }
  c.appendChild(top);
  pathTo(focusId).forEach((n, i, arr) => {
    c.appendChild(el("span", "sep", "›"));
    if (i === arr.length - 1) c.appendChild(el("b", null, n.title));
    else { const b = el("button", null, n.title); b.type = "button"; b.addEventListener("click", () => go(n.id)); c.appendChild(b); }
  });
}
function renderCard(pinned) {
  const card = document.getElementById("card"); card.textContent = "";
  const n = frontId && nodes[frontId];
  if (!n) { card.appendChild(el("div", "empty", pts.length ? "转动球，正面那件事会显示在这里。" : Object.keys(nodes).length ? "这一层是空的。" : "还没有数据。在任何一个 Claude session 里说“同步记事本”。")); return; }
  const st = rollup(n), row = el("div", "row");
  const d = el("i", "dot s-" + st); row.appendChild(d); row.appendChild(el("span", "ttl", n.title));
  card.appendChild(row);
  const meta = el("div", "row");
  meta.appendChild(el("span", "chip st", ST[st]));
  if (TYPE[n.type] && n.type !== "task") meta.appendChild(el("span", "chip", TYPE[n.type]));
  if (n.owner) meta.appendChild(el("span", "chip", n.owner));
  if (n.date) meta.appendChild(el("span", "chip", n.date + (n.updated && n.updated !== n.date ? " → " + n.updated : "")));
  const ks = kids(n.id); if (ks.length) { const [a, t] = leaves(n); meta.appendChild(el("span", "chip", "完成 " + a + "/" + t)); }
  card.appendChild(meta);
  if (n.next && st !== "done") { const p = el("div", "next"); p.appendChild(el("b", null, "下一步 ")); p.appendChild(document.createTextNode(n.next)); card.appendChild(p); }
  const bl = (n.blocked_by || []).filter(id => nodes[id] && rollup(nodes[id]) !== "done");
  if (bl.length) card.appendChild(el("div", "blk", "等 " + bl.map(id => nodes[id].title).join("、")));
  if (n.type === "decision" && n.status === "decide") card.appendChild(optionRow(n));
  if (ks.length) {
    const box = el("div", "kids");
    ks.slice().sort((a, b) => RANK[rollup(b)] - RANK[rollup(a)]).forEach(k => { const b = el("button", "kid"); b.type = "button"; b.appendChild(el("i", "dot s-" + rollup(k))); b.appendChild(document.createTextNode(shorten(k.title, 18))); b.addEventListener("click", () => { go(n.id); setTimeout(() => open(k.id), 0); }); box.appendChild(b); });
    card.appendChild(box);
    const acts = el("div", "actions"); const b = el("button", "btn", "进入 " + shorten(n.title, 10) + " →"); b.type = "button"; b.addEventListener("click", () => go(n.id)); acts.appendChild(b); card.appendChild(acts);
  }
}
function optionRow(n) {
  const box = el("div"); const opts = el("div", "opts");
  (n.options || []).forEach(o => { const b = el("button", "opt" + (n.answer === o ? " chosen" : ""), o); b.type = "button"; b.addEventListener("click", () => choose(n, o, b)); opts.appendChild(b); });
  box.appendChild(opts);
  if (n.answer) box.appendChild(el("div", "answered", "已选：" + n.answer + "（Claude 下次同步时写回）"));
  return box;
}
async function choose(n, o, btn) {
  if (!db) return;
  btn.disabled = true;
  try {
    await db.collection("nodes").doc(n.id).update({ answer: o, answered_at: new Date().toISOString() });
    try { const c = await claude.use("comments"); if (c && (await c.canSendToClaude()) === "available") await c.sendToClaude({ anchor: await c.anchorFor(document.getElementById("h-dec")), text: "决定 " + n.id + "：" + o }); } catch (e) {}
  } catch (e) { btn.disabled = false; btn.parentNode.after(el("div", "answered", "没记上（" + ((e && e.code) || "错误") + "），可以在评论里写给 Claude。")); }
}
function renderDecisions() {
  const box = document.getElementById("decisions"); box.textContent = ""; box.className = "";
  const ds = Object.values(nodes).filter(n => n.type === "decision" && n.status === "decide");
  if (!ds.length) { box.className = "empty"; box.textContent = "现在没有等你决定的事。"; return; }
  ds.forEach(n => {
    const c = el("div", "dcard"); const q = el("div", "q", n.title); q.title = "在球上找到它";
    q.addEventListener("click", () => { go(n.parent || null); setTimeout(() => open(n.id), 0); stage.scrollIntoView({ block: "nearest" }); });
    c.appendChild(q);
    const path = pathTo(n.parent).map(p => p.title); if (path.length) c.appendChild(el("div", "next", path.join(" › ")));
    c.appendChild(optionRow(n)); box.appendChild(c);
  });
}
function renderLog() {
  const ol = document.getElementById("log"); ol.textContent = "";
  const rows = (meta && Array.isArray(meta.recent)) ? meta.recent : [];
  if (!rows.length) { ol.appendChild(el("li", "empty", "还没有动态。")); return; }
  rows.slice(0, 20).forEach(r => { const li = el("li"); li.appendChild(el("time", null, r.ts || "")); li.appendChild(el("span", null, r.text || "")); ol.appendChild(li); });
}
function renderAll(relayout) {
  if (focusId && !nodes[focusId]) focusId = null;
  if (relayout) layout();
  renderCrumbs(); renderCard(); renderDecisions(); renderLog();
  document.getElementById("stamp").textContent = meta && meta.snapshot ? "最近同步 " + meta.snapshot : "还没有同步过";
}
document.getElementById("showDone").addEventListener("change", e => { showDone = e.target.checked; try { localStorage.setItem("ttShowDone", showDone ? "1" : "0"); } catch (x) {} layout(); });
window.addEventListener("resize", resize);
try { const h = decodeURIComponent((location.hash || "").slice(1)); if (h) focusId = h; } catch (e) {}
resize(); layout(); renderAll(false); requestAnimationFrame(tick);

(async () => {
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) { document.getElementById("stamp").textContent = "这个视图读不到数据（需要登录并打开原链接）。"; return; }
  let first = true;
  db.collection("nodes").onSnapshot(snap => {
    const next = {}; let m = null;
    snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === "_meta") m = v; else next[d.id] = Object.assign({ id: d.id }, v); });
    const shapeChanged = first || Object.keys(next).sort().join() !== Object.keys(nodes).sort().join();
    nodes = next; meta = m; first = false;
    renderAll(shapeChanged);
  }, err => { document.getElementById("stamp").textContent = "读取失败（" + ((err && err.code) || "错误") + "）。"; });
})();

(async () => {
  const btn = document.getElementById("refreshBtn"), msg = document.getElementById("refreshMsg");
  let c = null;
  try { c = await claude.use("comments"); } catch (e) { c = null; }
  btn.addEventListener("click", async () => {
    if (!c) { msg.textContent = "请在评论里写“同步记事本”"; return; }
    btn.disabled = true; msg.textContent = "正在发给 Claude…";
    let ok = false, code = "";
    try { if ((await c.canSendToClaude()) === "available") { await c.sendToClaude({ anchor: await c.anchorFor(document.getElementById("treeTitle")), text: "同步记事本" }); ok = true; } else code = "no_session"; }
    catch (e) { code = (e && e.code) || "error"; }
    btn.disabled = false;
    if (ok) { msg.textContent = "已发给 Claude"; return; }
    try { const r = await c.openComposer({ element: document.getElementById("treeTitle") }); msg.textContent = r && r.opened ? "写“同步记事本”，点 Send to Claude" : "发送没成功（" + code + "）"; }
    catch (e2) { msg.textContent = "发送没成功（" + code + "）"; }
  });
})();
</script>
