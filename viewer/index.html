<title>动态记事本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: a "map of work" — nested circles of the whole tree on a soft stage (left), the selected
   node's card beside it (right; stacked on phones), decisions and activity below.
   Visual idea: a quiet slate ground; status colors are muted inks; parents are tinted glass rings
   of their most urgent status; leaves are small lit beads; names sit on paper pills. */
:root {
  --bg: #eef1f4; --panel: #fbfcfd; --fg: #1d2430; --muted: #66717d; --rule: #dde3ea;
  --accent: #3a5f8a;
  --decide: #7a5bd0; --blocked: #cc5a4c; --doing: #d99a35; --waiting: #98a3af; --done: #5a9f7e;
  --stage-hi: #ffffff; --stage-lo: #e6ebf1; --pill: #ffffffee; --pill-fg: #1d2430; --shadow: rgba(24, 39, 60, .18);
  --chip-bg: #edf1f5;
  --display: "Noto Serif SC", "Songti SC", serif;
  --sans: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --panel: #151c25; --fg: #e6ebf1; --muted: #93a0ad; --rule: #263140;
  --accent: #8db6df;
  --decide: #a88bf0; --blocked: #ea8273; --doing: #ecb456; --waiting: #7f8b98; --done: #6fc29a;
  --stage-hi: #1c2633; --stage-lo: #0f151d; --pill: #1b2430ee; --pill-fg: #e6ebf1; --shadow: rgba(0, 0, 0, .45);
  --chip-bg: #1f2833; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151c25; --fg: #e6ebf1; --muted: #93a0ad; --rule: #263140;
  --accent: #8db6df;
  --decide: #a88bf0; --blocked: #ea8273; --doing: #ecb456; --waiting: #7f8b98; --done: #6fc29a;
  --stage-hi: #1c2633; --stage-lo: #0f151d; --pill: #1b2430ee; --pill-fg: #e6ebf1; --shadow: rgba(0, 0, 0, .45);
  --chip-bg: #1f2833; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 44px; display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
.titlebar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: .04em; }
.summary { font-size: .9rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.summary b { font-family: var(--mono); font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.summary .k { display: inline-flex; align-items: center; gap: 6px; }
.stamp { color: var(--muted); font-size: .78rem; margin-left: auto; }
.main { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 820px) { .main { grid-template-columns: minmax(0, 1.45fr) minmax(280px, 1fr); } .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.stage { position: relative; border-radius: 20px; overflow: hidden; background: radial-gradient(120% 90% at 50% 35%, var(--stage-hi), var(--stage-lo)); box-shadow: 0 1px 0 var(--rule) inset, 0 10px 30px -18px var(--shadow); }
.crumbs { position: absolute; left: 12px; top: 10px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .82rem; z-index: 2; pointer-events: none; }
.crumbs > * { pointer-events: auto; }
.crumbs button { font: inherit; border: 0; background: var(--pill); color: var(--accent); border-radius: 999px; padding: 2px 10px; cursor: pointer; box-shadow: 0 1px 3px var(--shadow); }
.crumbs b { font-weight: 500; background: var(--pill); border-radius: 999px; padding: 2px 10px; box-shadow: 0 1px 3px var(--shadow); }
.sep { color: var(--muted); }
svg#pack { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; }
svg#pack:active { cursor: grabbing; }
.tools { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 20px); }
.tools button { font: inherit; font-size: .78rem; border: 0; background: var(--pill); color: var(--accent); border-radius: 999px; padding: 4px 12px; cursor: pointer; box-shadow: 0 1px 3px var(--shadow); min-width: 32px; }
.gesture { position: absolute; left: 12px; top: 44px; z-index: 2; font-size: .72rem; color: var(--muted); pointer-events: none; }
svg#pack .node { cursor: pointer; transition: filter .2s; }
svg#pack .node:hover { filter: brightness(1.06); }
svg#pack .pill rect { fill: var(--pill); }
svg#pack .pill text { font-family: var(--sans); fill: var(--pill-fg); }
svg#pack .pill text.ws { font-family: var(--display); }
svg#pack .pill text.n { font-family: var(--mono); fill: var(--muted); }
svg#pack .pill { pointer-events: none; }
@keyframes halo { from { stroke-opacity: .55; stroke-width: 2px; } to { stroke-opacity: 0; stroke-width: 14px; } }
svg#pack .halo { fill: none; stroke: var(--decide); animation: halo 2.2s ease-out infinite; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .74rem; color: var(--muted); padding: 8px 4px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.s-done { background: var(--done); } .s-doing { background: var(--doing); } .s-waiting { background: var(--waiting); }
.s-blocked { background: var(--blocked); } .s-decide { background: var(--decide); }
.card { background: var(--panel); border-radius: 16px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; box-shadow: 0 1px 0 var(--rule) inset, 0 10px 30px -20px var(--shadow); border-top: 4px solid var(--st, var(--rule)); }
.card .eyebrow { font-size: .74rem; letter-spacing: .08em; color: var(--muted); }
.card .ttl { font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.35; overflow-wrap: anywhere; text-wrap: balance; }
.card .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card a { color: var(--accent); font-size: .86rem; }
.chip { font-size: .74rem; padding: 2px 9px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); white-space: nowrap; }
.chip.st { color: #fff; background: var(--st, var(--waiting)); }
.next { font-size: .9rem; color: var(--fg); background: var(--chip-bg); border-radius: 10px; padding: 8px 10px; overflow-wrap: anywhere; }
.next b { font-weight: 500; color: var(--muted); margin-right: 6px; font-size: .78rem; letter-spacing: .06em; }
.blk { font-size: .84rem; color: var(--blocked); }
.ses { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.sesbtn { font: inherit; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--accent); color: var(--panel); border-radius: 10px; padding: 7px 14px; font-size: .9rem; font-weight: 500; max-width: 100%; }
.sesbtn .ico { font-family: var(--mono); }
button.copy { font: inherit; font-size: .78rem; border: 1px solid var(--rule); background: var(--panel); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.ses code { flex-basis: 100%; font-family: var(--mono); font-size: .7rem; color: var(--muted); overflow-wrap: anywhere; user-select: all; }
.ses .path { flex-basis: 100%; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--chip-bg); }
.bar i { display: block; height: 100%; }
.kids { display: grid; }
.kid { font: inherit; font-size: .88rem; display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-top: 1px solid var(--rule); background: none; color: var(--fg); padding: 8px 2px; cursor: pointer; min-width: 0; }
.kid:hover .t { color: var(--accent); }
.kid span.t { flex: 1; overflow-wrap: anywhere; }
.kid span.c { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; }
.ptree { display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 10px; }
.ptree ul { list-style: none; margin: 0 0 0 4px; padding: 0 0 0 14px; border-left: 1px solid var(--rule); }
.ptree > ul { margin-left: 0; padding-left: 0; border-left: 0; }
.ptree li { position: relative; padding: 3px 0; min-width: 0; }
.ptree ul ul > li::before { content: ""; position: absolute; left: -14px; top: 14px; width: 10px; border-top: 1px solid var(--rule); }
.ptree .r { display: flex; align-items: baseline; gap: 8px; font-size: .86rem; min-width: 0; }
.ptree .r .dot { position: relative; top: 1px; }
.ptree .r span.t { flex: 1; overflow-wrap: anywhere; }
.ptree .r time { font-family: var(--mono); font-size: .72rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ptree button.r { font: inherit; border: 0; background: none; color: var(--muted); padding: 0; cursor: pointer; text-align: left; width: 100%; }
.ptree button.r:hover span.t { color: var(--accent); }
.ptree .head { font-weight: 600; color: var(--fg); }
.ptree .cur > .r { font-weight: 600; color: var(--fg); background: var(--chip-bg); border-radius: 8px; padding: 3px 8px; margin-left: -8px; }
.ptree .step .r { color: var(--fg); }
.ptree .step.k-create .dot, .ptree .step.k-note .dot, .ptree .step.k-next .dot, .ptree .step.k-move .dot { background: var(--chip-bg); box-shadow: 0 0 0 1px var(--muted) inset; }
.ptree .step.k-answer .dot { background: var(--decide); }
.ptree .step.todo .r span.t { border: 1px dashed var(--muted); border-radius: 8px; padding: 2px 8px; color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.panel { background: var(--panel); border-radius: 16px; padding: 14px 18px; min-width: 0; box-shadow: 0 1px 0 var(--rule) inset; }
h2 { font-family: var(--display); font-size: 1.02rem; margin: 0 0 10px; letter-spacing: .04em; }
.dcard { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--rule); }
.dcard:first-child { border-top: 0; padding-top: 0; }
.dcard .q { font-weight: 500; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.dcard .q:hover { color: var(--accent); }
.path { font-size: .78rem; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
button.opt { font: inherit; font-size: .84rem; border: 1px solid var(--rule); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 3px 14px; cursor: pointer; }
button.opt:hover { border-color: var(--decide); color: var(--decide); }
button.opt.chosen { border-color: var(--decide); background: var(--decide); color: #fff; }
.answered { font-size: .8rem; color: var(--decide); }
.empty { color: var(--muted); font-size: .88rem; }
ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ol.log li { display: grid; grid-template-columns: 6.6em 1fr; gap: 10px; font-size: .86rem; min-width: 0; }
ol.log time { font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
ol.log span { overflow-wrap: anywhere; }
#refreshBtn { border: 0; background: var(--panel); color: var(--accent); border-radius: 999px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 1px 3px var(--shadow); }
#refreshMsg { font-size: .78rem; color: var(--muted); }
label.tog { font-size: .78rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
@media (prefers-reduced-motion: reduce) { svg#pack .halo { animation: none; stroke-opacity: .5; } svg#pack .node { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="titlebar">
      <h1 id="treeTitle">动态记事本</h1>
      <button id="refreshBtn" type="button" title="让 Claude 同步" aria-label="让 Claude 同步"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>
      <span id="refreshMsg"></span>
      <span class="stamp" id="stamp">正在读取…</span>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <div class="main">
    <div>
      <div class="stage">
        <div class="crumbs" id="crumbs" aria-label="位置"></div>
        <div class="tools">
          <button type="button" id="zoomIn" aria-label="放大">＋</button><button type="button" id="zoomOut" aria-label="缩小">－</button>
          <button type="button" id="resetBtn" title="回到原来的位置和大小">复位视图</button>
          <button type="button" id="relayoutBtn" title="这一层的圆回到自动排列">恢复默认排列</button>
        </div>
        <div class="gesture" aria-hidden="true">拖圆调整位置 · 拖空白平移 · 点圆进入</div>
        <svg id="pack" role="img" aria-label="所有事情的嵌套圆：大圆是工作线，里面的小圆是项目和任务。点一个圆放大进去，点空白处退出一层。"></svg>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i class="dot s-decide"></i>等你决定</span><span><i class="dot s-blocked"></i>卡住</span>
        <span><i class="dot s-doing"></i>在做</span><span><i class="dot s-waiting"></i>等待</span><span><i class="dot s-done"></i>完成</span>
        <span>大圆的颜色 = 里面最急的事</span>
        <label class="tog"><input type="checkbox" id="hideDone"> 隐藏已完成</label>
      </div>
    </div>
    <div class="side"><div class="card" id="card" aria-live="polite"><div class="empty">Claude 同步数据后，这里显示你点中的那件事。</div></div></div>
  </div>

  <div class="cols">
    <section class="panel" aria-labelledby="h-dec"><h2 id="h-dec">等你决定</h2><div id="decisions" class="empty">读取中。</div></section>
    <section class="panel" aria-labelledby="h-log"><h2 id="h-log">最近动态</h2><ol class="log" id="log"><li class="empty">读取中。</li></ol></section>
  </div>
</div>

<script>
const ST = { done: "完成", doing: "在做", waiting: "等待", blocked: "卡住", decide: "等你决定" };
const RANK = { decide: 5, blocked: 4, doing: 3, waiting: 2, done: 1 };
const TYPE = { workstream: "工作线", project: "项目", decision: "决定", deliverable: "交付物", job: "作业", task: "任务" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let nodes = {}, meta = null, db = null, hideDone = false;
let root = null, focus = null, selected = null, view = null, base = null, ut = d3.zoomIdentity, firstDraw = true;
try { hideDone = localStorage.getItem("ttHideDone") === "1"; } catch (e) {}
document.getElementById("hideDone").checked = hideDone;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const C = s => css("--" + s);

// ----- tree rules (same as tasktree/model.py) -----
function kidsOf(id) { return Object.values(nodes).filter(n => (n.parent || null) === id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function rollup(n, seen = new Set()) {
  if (seen.has(n.id)) return n.status || "waiting"; seen.add(n.id);
  const ks = kidsOf(n.id);
  if (!ks.length) return n.status || "waiting";
  const sts = ks.map(k => rollup(k, seen));
  if (sts.every(s => s === "done")) return ["doing", "blocked", "decide"].includes(n.status) ? n.status : "done";
  let best = "waiting"; for (const s of sts) if (s !== "done" && RANK[s] > RANK[best]) best = s;
  if (n.status && n.status !== "done" && RANK[n.status] > RANK[best]) best = n.status;
  return best;
}
function leafStats(n) { const ks = kidsOf(n.id); if (!ks.length) return { [n.status || "waiting"]: 1 }; const out = {}; ks.forEach(k => { const s = leafStats(k); for (const x in s) out[x] = (out[x] || 0) + s[x]; }); return out; }
function short(t, max) { return t.length > max ? t.slice(0, Math.max(1, max - 1)) + "…" : t; }

// ----- circle packing -----
const svg = d3.select("#pack");
let W = 600;
function st(d) { return d.data.id === "__root" ? "doing" : rollup(d.data.node); }
function build() {
  const visible = id => !hideDone || rollup(nodes[id]) !== "done";
  const mk = id => {
    const ks = kidsOf(id === "__root" ? null : id).filter(k => visible(k.id));
    const n = id === "__root" ? { id: "__root", title: "全部" } : nodes[id];
    return { id, node: n, children: ks.length ? ks.map(k => mk(k.id)) : undefined };
  };
  const h = d3.hierarchy(mk("__root"))
    .sum(d => d.children ? 0 : (d.node.status === "done" ? 0.4 : d.node.type === "decision" ? 1.4 : 1))
    .sort((a, b) => (RANK[st(b)] - RANK[st(a)]) || (b.value - a.value));
  W = Math.min(document.querySelector(".stage").clientWidth || 600, 900);
  root = d3.pack().size([W, W]).padding(d => d.depth === 0 ? 14 : 6)(h);
  restoreLayout();
}

// ----- rearranging: drag a circle; its siblings make room; the arrangement is kept on this device -----
// Saved as each node's offset from its parent's center, in units of the parent's radius,
// so it survives re-syncs and size changes.
let layout = {};
try { layout = JSON.parse(localStorage.getItem("ttLayout") || "{}"); } catch (e) { layout = {}; }
const saveLayout = () => { try { localStorage.setItem("ttLayout", JSON.stringify(layout)); } catch (e) {} };
function shift(d, dx, dy) { d.each(n => { n.x += dx; n.y += dy; }); }
function keepInside(d) {
  const p = d.parent; if (!p) return;
  const pad = p.depth === 0 ? 14 : 6, dx = d.x - p.x, dy = d.y - p.y, dist = Math.hypot(dx, dy), lim = Math.max(0, p.r - d.r - pad);
  if (dist > lim) { const s = lim / (dist || 1); shift(d, p.x + dx * s - d.x, p.y + dy * s - d.y); }
}
// Push siblings apart (circle collision) and back inside the parent; `pinned` stays where the finger is.
function settle(p, pinned, rounds) {
  const sib = p.children || []; if (sib.length < 2) { sib.forEach(keepInside); return; }
  for (let it = 0; it < rounds; it++) {
    let moved = false;
    for (let i = 0; i < sib.length; i++) for (let j = i + 1; j < sib.length; j++) {
      const a = sib[i], b = sib[j], dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy) || 0.01, need = a.r + b.r + 4;
      if (dist >= need) continue;
      moved = true;
      const push = need - dist, ux = dx / dist, uy = dy / dist;
      const wa = a === pinned ? 0 : b === pinned ? 1 : 0.5, wb = 1 - wa;
      shift(a, -ux * push * wa, -uy * push * wa); shift(b, ux * push * wb, uy * push * wb);
    }
    sib.forEach(s => { if (s !== pinned) keepInside(s); });
    if (!moved) break;
  }
}
function restoreLayout() {
  const touched = new Set();
  root.each(d => {   // breadth-first: parents are placed before their children
    const rel = d.parent && layout[d.data.id];
    if (!rel) return;
    shift(d, d.parent.x + rel[0] * d.parent.r - d.x, d.parent.y + rel[1] * d.parent.r - d.y);
    touched.add(d.parent);
  });
  touched.forEach(p => settle(p, null, 80));
}
function remember(p) { (p.children || []).forEach(s => { layout[s.data.id] = [(s.x - p.x) / p.r, (s.y - p.y) / p.r]; }); saveLayout(); }
const dragger = d3.drag()
  .filter(e => !e.button && !(e.touches && e.touches.length > 1))
  .on("drag", (e, d) => {
    const k = W / view[2];
    shift(d, e.dx / k, e.dy / k); keepInside(d); settle(d.parent, d, 6); apply(view);
  })
  .on("end", (e, d) => { settle(d.parent, null, 40); apply(view); remember(d.parent); });
function resetLayout() {
  const ids = new Set((focus.children || []).flatMap(c => c.descendants().map(x => x.data.id)));
  ids.forEach(id => delete layout[id]); saveLayout(); renderAll();
}

function draw() {
  svg.attr("viewBox", `${-W / 2} ${-W / 2} ${W} ${W}`).selectAll("*").remove();
  svg.on("click", () => { if (focus && focus.parent) zoom(focus.parent); });
  const defs = svg.append("defs");
  defs.append("filter").attr("id", "lift").attr("x", "-30%").attr("y", "-30%").attr("width", "160%").attr("height", "160%")
    .append("feDropShadow").attr("dx", 0).attr("dy", 1.5).attr("stdDeviation", 1.8).attr("flood-color", C("shadow")).attr("flood-opacity", 1);
  ["decide", "blocked", "doing", "waiting", "done"].forEach(s => {
    const c = d3.color(C(s)), g = defs.append("radialGradient").attr("id", "bead-" + s).attr("cx", "35%").attr("cy", "30%").attr("r", "75%");
    g.append("stop").attr("offset", "0%").attr("stop-color", c.brighter(0.9));

  svg.append("circle").attr("class", "sel").attr("fill", "none").attr("stroke", C("fg")).attr("stroke-width", 2).attr("pointer-events", "none");

  pills.append("rect").attr("filter", "url(#lift)");
  pills.append("text").attr("class", d => "t" + (d.depth === 1 ? " ws" : "")).attr("text-anchor", "middle").attr("dy", "0.35em");
  pills.append("text").attr("class", "n").attr("text-anchor", "middle").attr("dy", "0.35em");

function zoom(d) {

// ----- DOM parts -----
function renderSummary() {
  const box = document.getElementById("summary"); box.textContent = "";
  const ls = Object.values(nodes).filter(n => !kidsOf(n.id).length), cnt = s => ls.filter(n => n.status === s).length;
  [["decide", "件等你决定"], ["blocked", "件卡住"], ["doing", "件在做"], ["waiting", "件等待"]].forEach(([s, label]) => {
    const n = cnt(s); if (!n && s === "blocked") return;

  });
}
function renderCrumbs() {

    if (i === path.length - 1) c.appendChild(el("b", null, short(name, 16)));

  });
}
function progressBar(n) {

  ["done", "doing", "decide", "blocked", "waiting"].forEach(k => { if (s[k]) { const i = el("i"); i.style.width = (100 * s[k] / tot) + "%"; i.style.background = `var(--${k})`; bar.appendChild(i); } });

}
function renderCard() {

    if (!Object.keys(nodes).length) card.appendChild(el("div", "empty", "在任何一个 Claude session 里说“同步记事本”。"));

  if (n.next && s !== "done") { const p = el("div", "next"); p.appendChild(el("b", null, "下一步")); p.appendChild(document.createTextNode(n.next)); card.appendChild(p); }

  if (bl.length) card.appendChild(el("div", "blk", "等 " + bl.map(id => nodes[id].title).join("、")));
  if (Array.isArray(n.links) && n.links.some(l => l && /^https:\/\//.test(l.url || ""))) {
    const L = el("div", "row");

// A leaf opens as a small tree: its parent at the top, the siblings as branches,

function progressTree(d, s) {

async function choose(n, o, btn) {
  if (!db) return;
  btn.disabled = true;

    try { const c = await claude.use("comments"); if (c && (await c.canSendToClaude()) === "available") await c.sendToClaude({ anchor: await c.anchorFor(document.getElementById("h-dec")), text: "决定 " + n.id + "：" + o }); } catch (e) {}
  } catch (e) { btn.disabled = false; btn.parentNode.after(el("div", "answered", "没记上（" + ((e && e.code) || "错误") + "），可以在评论里写给 Claude。")); }
}
function renderDecisions() {
  const box = document.getElementById("decisions"); box.textContent = ""; box.className = "";
  const ds = Object.values(nodes).filter(n => n.type === "decision" && n.status === "decide");
  if (!ds.length) { box.className = "empty"; box.textContent = "现在没有等你决定的事。"; return; }
  ds.forEach(n => {

function renderLog() {

}
function renderAll() {
  const keepFocus = focus && focus.data.id, keepSel = selected && selected.data.id;
  build();

  draw(); renderSummary(); renderCrumbs(); renderCard(); renderDecisions(); renderLog();

document.getElementById("resetBtn").addEventListener("click", resetPan);

(async () => {
  try { db = await claude.use("db"); } catch (e) { db = null; }

  }, err => { document.getElementById("stamp").textContent = "读取失败（" + ((err && err.code) || "错误") + "）。"; });
})();

(async () => {
  const btn = document.getElementById("refreshBtn"), msg = document.getElementById("refreshMsg");
  let c = null;

  btn.addEventListener("click", async () => {
    if (!c) { msg.textContent = "请在评论里写“同步记事本”"; return; }
    btn.disabled = true; msg.textContent = "正在发给 Claude…";

    try { if ((await c.canSendToClaude()) === "available") { await c.sendToClaude({ anchor: await c.anchorFor(document.getElementById("treeTitle")), text: "同步记事本" }); ok = true; } else code = "no_session"; }

    try { const r = await c.openComposer({ element: document.getElementById("treeTitle") }); msg.textContent = r && r.opened ? "写“同步记事本”，点 Send to Claude" : "发送没成功（" + code + "）"; }
    catch (e2) { msg.textContent = "发送没成功（" + code + "）"; }
  });
})();
