[project]
name = "tasktree"
version = "0.1.0"
description = "A personal task tree with an append-only event log and an MCP server for Claude"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tasktree = "tasktree.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tasktree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
